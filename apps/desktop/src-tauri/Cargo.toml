[package]
name = "code-ready-desktop"
version = "0.0.0"
description = "Code-Ready V2 desktop application"
authors = ["Code-Ready"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "code_ready_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "code-ready-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11", features = [] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1.0"
